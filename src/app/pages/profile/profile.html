<app-header></app-header>

<div class="container mt-5 pt-4">

  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card shadow border-0 rounded-4">

        <!-- CABECERA -->
        <div class="card-body text-center position-relative p-4">

          <!-- LÁPIZ -->
          <button
            class="btn btn-light position-absolute top-0 end-0 m-3 rounded-circle"
            (click)="toggleEdit()"
            title="Editar perfil">
            <i class="bi bi-pencil"></i>
          </button>

          <!-- IMAGEN -->
          @if (nurse.imageUrl) {
            <img
              [src]="nurse.imageUrl"
              class="rounded-circle object-fit-cover mb-3 shadow-sm"
              style="width:130px; height:130px;">
          } @else {
            <div
              class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center mx-auto mb-3"
              style="width:130px; height:130px; font-size:26px;">
              N/A
            </div>
          }

          <h4 class="fw-bold mb-1">{{ nurse.name }}</h4>
          <p class="text-muted mb-0">{{ nurse.email }}</p>
        </div>

        <hr class="m-0">

        <!-- ================= -->
        <!-- MODO VISTA -->
        <!-- ================= -->
        @if (!editMode) {
          <div class="card-body p-4">

            <div class="row g-3">

              <div class="col-12 d-flex justify-content-between">
                <span class="text-muted">Usuario</span>
                <span>{{ nurse.user }}</span>
              </div>

              <div class="col-12 d-flex justify-content-between">
                <span class="text-muted">Estado</span>
                <span class="badge bg-success" *ngIf="nurse.working">Activo</span>
                <span class="badge bg-secondary" *ngIf="!nurse.working">Inactivo</span>
              </div>

            </div>

          </div>
        }

        <!-- ================= -->
        <!-- MODO EDICIÓN -->
        <!-- ================= -->
        @else {
          <form class="card-body p-4" (ngSubmit)="saveProfile()">

            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" [(ngModel)]="nurse.name" name="name">
            </div>

            <div class="mb-3">
              <label class="form-label">Usuario</label>
              <input type="text" class="form-control" [(ngModel)]="nurse.user" name="user">
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" [(ngModel)]="nurse.email" name="email">
            </div>

            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" [(ngModel)]="nurse.password" name="password">
            </div>

            <div class="mb-3">
              <label class="form-label">Imagen (URL)</label>
              <input type="text" class="form-control" [(ngModel)]="nurse.imageUrl" name="imageUrl">
            </div>

            <div class="form-check mb-4">
              <input
                class="form-check-input"
                type="checkbox"
                [(ngModel)]="nurse.working"
                name="working"
                id="working">
              <label class="form-check-label" for="working">
                Nurse activo
              </label>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary w-100">
                Guardar cambios
              </button>

              <button type="button" class="btn btn-outline-secondary w-100" (click)="toggleEdit()">
                Cancelar
              </button>
            </div>

          </form>
        }

      </div>

    </div>
  </div>

</div>
